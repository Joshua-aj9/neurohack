# SSVEP + LLM speller (apps/speller). Targets: 0=top 1=right 2=bottom 3=left (stim.yaml frequency order).
letters: "abcdefghijklmnopqrstuvwxyz"
labels:                       # ASCII labels render in every font
  space: "space"
  undo: "undo"
  send: "send"
  back: "back"
  more: "more >"
  cancel: "cancel"
return_to_suggestions_after_letter: true
contexts:
  - "How are you feeling today?"
  - "Do you want something to drink?"
  - "Are you comfortable?"
  - "What would you like to do this afternoon?"
timing:
  feedback_s: 0.6             # selected target highlighted
  gap_s: 1.0                  # static targets before each flicker (counted in ITR / wpm time). Was 0.5;
                              # LIVE G3 6 Nov, simulated: gaze 0.25 s late -> committed acc 0.95 -> 0.85,
                              # 0.5 s late -> 0.68. G3 itself used a 1 s cue (calibrate.py).
  message_s: 1.2              # abstain / timeout message
  result_s: 4.0               # metrics screen after "send"
ui:
  text_font_size: 46
  label_font_size: 36         # labels are drawn INSIDE the flickering squares (logic.label_lines)
  label_letters_per_line: 4
  label_outline_rgb: [0, 0, 0] # text = text_rgb with this outline: readable at every flicker level
  label_outline_px: 2
  label_pad_px: 12             # wrap label lines wider than target size - 2 * pad
  small_font_size: 22
  text_rgb: [235, 235, 235]
  dim_rgb: [140, 140, 140]
  highlight_rgb: [60, 200, 90]
  warn_rgb: [240, 170, 40]
  bad_rgb: [230, 60, 60]
  quality_box_px: 26
calibration_file: results/user_calibration.json
synthetic_calibration_trials_per_target: 10
