[project]
name = "neurohack"
version = "0.1.0"
description = "Generic real-time EEG infrastructure (sources, quality, SSVEP decoding, closed loop) + thin hackathon apps"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "mne",
    "pylsl",
    "pyxdf",
    "pygame-ce",
    "moabb",
    "openai",
    "pyyaml",
    "matplotlib",
    "psutil",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurohack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]
